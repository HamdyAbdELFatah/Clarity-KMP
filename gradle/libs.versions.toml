[versions]
kotlin = "2.3.21"
agp = "9.2.0"
compose-multiplatform = "1.11.0"
clarity-sdk = "3.8.2"
clarity-ios-sdk = "3.5.3"
vanniktech-publish = "0.30.0"
dokka = "2.0.0"
binary-compatibility-validator = "0.18.1"
androidx-activity-compose = "1.11.0"
robolectric = "4.15"

[libraries]
clarity-sdk = { group = "com.microsoft.clarity", name = "clarity", version.ref = "clarity-sdk" }
clarity-compose-sdk = { group = "com.microsoft.clarity", name = "clarity-compose", version.ref = "clarity-sdk" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity-compose" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose-multiplatform" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose-multiplatform" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "compose-multiplatform" }
compose-ui-test = { group = "org.jetbrains.compose.ui", name = "ui-test", version.ref = "compose-multiplatform" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
