name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :clarity-kmp:testDebugUnitTest :clarity-kmp-compose:testDebugUnitTest lintRelease apiCheck dokkaGenerate --stacktrace

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - run: ./gradlew :clarity-kmp:compileTestKotlinIosSimulatorArm64 :clarity-kmp-compose:iosSimulatorArm64Test :sample:composeApp:linkDebugFrameworkIosSimulatorArm64 apiCheck --stacktrace
      - run: xcodebuild -project sample/iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

