# Consumer test build JVM/memory settings. The consumer-tests project is invoked as a separate
# Gradle process (see verifyPublishedConsumers in the root build) and does not inherit the root
# project's gradle.properties, so it needs its own heap settings to link the iOS frameworks.
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options="-Xmx2048M"
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true

android.useAndroidX=true
android.nonTransitiveRClass=true

org.jetbrains.compose.experimental.uikit.enabled=true
